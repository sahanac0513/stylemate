<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" fill="none">
  <defs>
    <linearGradient id="blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEEF2" />
      <stop offset="100%" stop-color="#F7DDE5" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE9BAE" />
      <stop offset="100%" stop-color="#C77D91" />
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#914561" />
      <stop offset="100%" stop-color="#783B52" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D06F" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura Rings -->
  <circle cx="250" cy="190" r="140" fill="url(#blushGrad)" opacity="0.65" />
  <circle cx="250" cy="190" r="100" stroke="#C77D91" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="250" cy="190" r="160" stroke="#F7DDE5" stroke-width="2" opacity="0.5" />

  <!-- Floating Fashion Accessories & Accents -->
  <!-- Left Side: Chic Handbag -->
  <g transform="translate(90, 150) rotate(-6)">
    <rect x="0" y="20" width="70" height="55" rx="14" fill="#FFFFFF" stroke="#C77D91" stroke-width="2" />
    <path d="M15 20 C15 5, 55 5, 55 20" fill="none" stroke="#783B52" stroke-width="3" stroke-linecap="round" />
    <circle cx="35" cy="45" r="5" fill="url(#goldGrad)" />
    <path d="M0 35 L70 35" stroke="#F7DDE5" stroke-width="2" />
    <path d="M30 45 L35 55 L40 45" stroke="#C77D91" stroke-width="1.5" fill="none" />
  </g>

  <!-- Right Side: High Heel Shoe -->
  <g transform="translate(340, 160) rotate(8)">
    <path d="M10 60 Q30 58 45 42 Q60 25 75 22 Q85 20 90 28 Q85 36 68 46 Q45 60 20 62 Z" fill="#FFFFFF" stroke="#783B52" stroke-width="2" />
    <!-- Heel stem -->
    <path d="M80 26 L83 62" stroke="#783B52" stroke-width="3.5" stroke-linecap="round" />
    <!-- Delicate ankle strap -->
    <path d="M50 35 C55 20, 68 15, 75 22" fill="none" stroke="#C77D91" stroke-width="2" stroke-dasharray="2 3" />
    <circle cx="83" cy="27" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Center: Haute Couture Dress Mannequin -->
  <!-- Wooden Stand Base -->
  <ellipse cx="250" cy="330" rx="42" ry="9" fill="#29252A" opacity="0.12" />
  <path d="M225 330 C225 324, 275 324, 275 330 Z" fill="#C77D91" />
  <rect x="248" y="250" width="4" height="75" fill="#783B52" rx="2" />
  <ellipse cx="250" cy="255" rx="9" ry="3" fill="#D4AF37" />

  <!-- Tailor Dummy Torso & Gown -->
  <path d="M236 95 C236 82, 264 82, 264 95 L260 115 C260 118, 278 126, 282 145 C286 164, 274 185, 268 200 L275 270 C258 276, 242 276, 225 270 L232 200 C226 185, 214 164, 218 145 C222 126, 240 118, 240 115 Z" fill="#FFFFFF" stroke="#783B52" stroke-width="2.5" />
  
  <!-- Gown Details / Corset lines -->
  <path d="M224 140 C238 152, 262 152, 276 140" fill="none" stroke="#DE9BAE" stroke-width="2" />
  <path d="M228 170 C240 178, 260 178, 272 170" fill="none" stroke="#C77D91" stroke-width="1.8" />
  
  <!-- Couture Drape Sash -->
  <path d="M222 145 C235 155, 260 180, 274 235 C265 240, 250 240, 240 220 C234 205, 226 180, 222 145 Z" fill="url(#roseGrad)" opacity="0.85" />
  <path d="M246 175 C255 200, 262 230, 270 265" stroke="url(#burgundyGrad)" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Wooden Finial Neck Top -->
  <path d="M246 80 Q250 72 254 80 Q252 86 248 86 Z" fill="url(#goldGrad)" stroke="#783B52" stroke-width="1.5" />
  <ellipse cx="250" cy="88" rx="7" ry="3" fill="#D4AF37" />

  <!-- Sparkling Fashion Magic Stars -->
  <!-- Top Left Sparkle -->
  <g transform="translate(145, 80)">
    <path d="M12 0 Q12 12 24 12 Q12 12 12 24 Q12 12 0 12 Q12 12 12 0 Z" fill="url(#goldGrad)" filter="url(#softGlow)" />
  </g>
  <!-- Top Right Sparkle -->
  <g transform="translate(325, 95)">
    <path d="M9 0 Q9 9 18 9 Q9 9 9 18 Q9 9 0 9 Q9 9 9 0 Z" fill="url(#roseGrad)" />
  </g>
  <!-- Mini Stars -->
  <circle cx="130" cy="130" r="3" fill="#C77D91" />
  <circle cx="360" cy="135" r="2.5" fill="#D4AF37" />
  <circle cx="180" cy="65" r="2" fill="#783B52" />
  <circle cx="310" cy="60" r="3.5" fill="#DE9BAE" opacity="0.8" />
  <circle cx="375" cy="245" r="2" fill="#C77D91" />
  <circle cx="115" cy="235" r="3" fill="url(#goldGrad)" />

  <!-- Stylish Hanger floating -->
  <g transform="translate(180, 105) rotate(-14) scale(0.7)">
    <path d="M25 15 C25 2, 35 2, 35 15 C35 22, 28 25, 28 32 L5 50 L55 50 Z" fill="none" stroke="#783B52" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="5" y1="50" x2="55" y2="50" stroke="#D4AF37" stroke-width="2" />
  </g>

  <!-- Chic ribbon accent -->
  <path d="M210 280 C235 270, 265 295, 290 280" fill="none" stroke="#F7DDE5" stroke-width="4" stroke-linecap="round" />
</svg>